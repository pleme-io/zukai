[package]
name = "zukai-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "zukai — clap CLI (`zukai render --target …`)."

[[bin]]
name = "zukai"
path = "src/main.rs"

[dependencies]
zukai-model  = { path = "../zukai-model", version = "0.0.1" }
zukai-render = { path = "../zukai-render", version = "0.0.1" }
clap = { version = "4.5", features = ["derive", "env"] }
